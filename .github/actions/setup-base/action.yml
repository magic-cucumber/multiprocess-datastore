name: Setup Base Environment
description: Set up JDK 17, Gradle, Android SDK, and native build tools

inputs:
  platform:
    description: 'Whether to install Linux-specific native dependencies'
    required: true

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Install Linux native dependencies
      if: ${{ inputs.platform == 'linux' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Make Gradlew execuable
      if: ${{ inputs.platform != 'windows' }}
      shell: bash
      run: |
        chmod +x ./gradlew
